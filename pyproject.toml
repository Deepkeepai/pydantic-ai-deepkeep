[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pydantic-ai-deepkeep"
version = "0.1.0"
description = "DeepKeep AI Firewall custom capability for Pydantic AI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "DeepKeep", email = "info@deepkeep.ai"}
]
keywords = ["deepkeep", "pydantic-ai", "guardrails", "capability", "ai-firewall", "moderation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic-ai-slim>=2.34.0",
]

[project.urls]
Homepage = "https://deepkeep.ai"
Repository = "https://github.com/Deepkeepai/pydantic-ai-deepkeep"
Documentation = "https://github.com/Deepkeepai/pydantic-ai-deepkeep#readme"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[tool.setuptools.packages.find]
include = ["pydantic_ai_deepkeep*"]
